# AgroTwin behind nginx with https — /etc/nginx/sites-available/agrotwin
# Replace agrotwin.example.edu everywhere; certificates from certbot (see deploy/README.md).
#
#   /api/...                  -> the API (uploads stream straight through)
#   /tiles/ /models/ /splats/ -> field map files straight from disk, each one
#                                after asking the API whether this signed-in
#                                user may see that survey (auth_request)
#   everything else           -> the web app

upstream agrotwin_web { server 127.0.0.1:3000; keepalive 16; }
upstream agrotwin_api { server 127.0.0.1:8000; keepalive 16; }

# a few sign-in attempts a minute per address; the API also pauses an account after repeated wrong passwords
limit_req_zone $binary_remote_addr zone=agrotwin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name agrotwin.example.edu;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;  # nginx older than 1.25: remove this line and write "listen 443 ssl http2;"
    server_name agrotwin.example.edu;

    ssl_certificate     /etc/letsencrypt/live/agrotwin.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrotwin.example.edu/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # a flight is uploaded 20 photos (up to ~400 MB) per request
    client_max_body_size 1100m;

    location = /api/auth/login {
        limit_req zone=agrotwin_login burst=5 nodelay;
        proxy_pass http://agrotwin_api;
        include /etc/nginx/agrotwin-proxy.conf;
    }

    location /api/ {
        proxy_pass http://agrotwin_api;
        include /etc/nginx/agrotwin-proxy.conf;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /tiles/ {
        auth_request /_agrotwin_file_access;
        alias /opt/agrotwin/frontend/public/tiles/;
        add_header Cache-Control "private, max-age=3600";
    }
    location /models/ {
        auth_request /_agrotwin_file_access;
        alias /opt/agrotwin/frontend/public/models/;
        add_header Cache-Control "private, max-age=3600";
    }
    location /splats/ {
        auth_request /_agrotwin_file_access;
        alias /opt/agrotwin/frontend/public/splats/;
        add_header Cache-Control "private, max-age=3600";
    }
    location = /_agrotwin_file_access {
        internal;
        proxy_pass http://agrotwin_api/api/auth/file-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        proxy_pass http://agrotwin_web;
        include /etc/nginx/agrotwin-proxy.conf;
    }
}
